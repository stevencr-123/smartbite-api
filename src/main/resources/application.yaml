spring:
  application:
    name: smartbite

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug


jwt:
  secret: c21hcnRiaXRlLXN1cGVyLXNlY3JldC1rZXktcGFyYS1qd3QtaHMyNTYtc2VndXJv
  expiration: 86400000

admin:
  service:
    url: http://localhost:8081
