spring:
  application:
    name: smartbite

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    # Feign / integración externa (ajustar según entorno)
    com.smartbite.operativo.client: debug
    feign: debug

admin:
  service:
    # TODO: ajustar por entorno (dev/stage/prod)
    url: http://localhost:8081
